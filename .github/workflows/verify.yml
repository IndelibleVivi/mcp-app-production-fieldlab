name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DO_NOT_TRACK: "1"
  SKYBRIDGE_TELEMETRY_DISABLED: "1"

jobs:
  source-process:
    name: Source and process
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Install exact dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Verify source and MCP process
        run: npm run check

      - name: Record evidence ceiling
        if: ${{ always() }}
        run: |
          {
            echo "## source-process"
            echo
            echo '- ceiling: `process`'
            echo '- not_proven: `browser-host, clean-package, activated-runtime, tunnel, named-host, owner-acceptance`'
            echo '- namedHostSimulation: `false`'
          } >> "$GITHUB_STEP_SUMMARY"

  browser-host:
    name: Local browser host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Install exact dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Reproduce resource prerequisite receipt
        run: npm run check

      - name: Verify declared local host profiles
        run: npm run test:host

      - name: Record evidence ceiling
        if: ${{ always() }}
        run: |
          {
            echo "## browser-host"
            echo
            echo '- ceiling: `process`'
            echo '- not_proven: `ChatGPT behavior, clean-package, activated-runtime, tunnel, named-host, owner-acceptance`'
            echo '- namedHostSimulation: `false`'
          } >> "$GITHUB_STEP_SUMMARY"

  clean-package-runtime:
    name: Clean package and isolated runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FIELDLAB_CANDIDATE: runtime-candidates/ci-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Install exact source dependencies
        run: npm ci

      - name: Install Playwright Chromium for prerequisite browser evidence
        run: npx playwright install --with-deps chromium

      - name: Reproduce clean source/process prerequisite receipt
        run: npm run check

      - name: Reproduce clean browser-host prerequisite receipt
        run: npm run test:host

      - name: Package clean committed revision
        run: npm run package:runtime -- --out="$FIELDLAB_CANDIDATE"

      - name: Smoke exact isolated candidate
        run: npm run smoke:runtime -- --candidate="$FIELDLAB_CANDIDATE"

      - name: Record evidence ceiling
        if: ${{ always() }}
        run: |
          {
            echo "## clean-package-runtime"
            echo
            echo '- ceiling: `activated-runtime` (exact isolated CI candidate only)'
            echo '- not_proven: `container activation, operator-selected production runtime, tunnel, named-host, owner-acceptance`'
            echo '- namedHostSimulation: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
